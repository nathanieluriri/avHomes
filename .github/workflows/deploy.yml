name: Deploy to Cloudflare

on:
  push:
    branches: [master]
  workflow_dispatch:

# One deploy at a time. A newer push supersedes a run that is still going.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SITE_URL: https://avhomes.uririnathaniel.workers.dev

jobs:
  deploy:
    name: Verify and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Fails in seconds with a readable message rather than letting the run
      # spend minutes building only to hit a cryptic wrangler auth error.
      - name: Check deploy credentials are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them under Settings, Secrets and variables, Actions."
            exit 1
          fi

      - name: Check out the commit being deployed
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Route and layout types (LayoutProps, PageProps) are generated into
      # .next/types, which tsconfig includes. Without this the typecheck fails
      # on a clean checkout that has never been built.
      - name: Generate route types
        run: npx next typegen

      # Verification runs before the deploy so a broken commit never ships.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build the Cloudflare bundle
        run: npx opennextjs-cloudflare build

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Confirms the worker actually serves the new build rather than trusting
      # that the upload succeeded. Each route asserts an expected status, so a
      # redirect quietly turning into a 404 is caught as well as an outage.
      - name: Smoke test the deployment
        run: |
          set -uo pipefail
          failed=0

          check() {
            path="$1"
            want="$2"
            got=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 3 --retry-all-errors "${SITE_URL}${path}")
            if [ "$got" = "$want" ]; then
              printf '  ok    %-46s %s\n' "$path" "$got"
            else
              printf '  FAIL  %-46s got %s, want %s\n' "$path" "$got" "$want"
              failed=1
            fi
          }

          check "/" 200
          check "/listings" 200
          check "/listings?status=For+Sale" 200
          check "/listings?status=For+Rent" 200
          check "/posts" 200
          check "/posts/lagos-service-charge-explained" 200
          check "/contact" 200
          check "/terms" 200
          check "/privacy" 200
          # The old blog paths must keep redirecting, not start 404ing.
          check "/blog" 307
          check "/blog/lagos-service-charge-explained" 307
          # An unknown post must 404 rather than render an empty shell.
          check "/posts/no-such-post" 404

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more routes returned an unexpected status after deploy"
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "### Deployed ${GITHUB_SHA:0:7}"
            echo ""
            echo "<${SITE_URL}>"
          } >> "$GITHUB_STEP_SUMMARY"
